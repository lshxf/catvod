name: Auto Download M3U

on:
  schedule:
    # 每 6 小时执行一次 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Download M3U
        env:
          # 将 tk 存入 GitHub Secret，方便后续更新
          M3U_URL: ${{ secrets.M3U_URL || 'https://live.catvod.com/?tk=883bbb11b5989f9103c729fc6d0cfa45' }}
        run: python scripts/download.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          # 只有文件变化时才提交
          git diff --cached --quiet || git commit -m "Update M3U playlist - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
