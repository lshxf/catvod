name: Auto Download M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chromium & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          pip install undetected-chromedriver

      - name: Download M3U via browser
        env:
          M3U_URL: ${{ secrets.M3U_URL || 'https://live.catvod.com/?tk=883bbb11b5989f9103c729fc6d0cfa45' }}
        run: python scripts/download.py

      - name: Check output
        run: |
          ls -lah output/ || true
          head -n 10 output/playlist.m3u || echo "No output file"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update M3U playlist - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
